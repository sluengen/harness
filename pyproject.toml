[project]
name = "harness"
version = "0.2.1"
description = "Evidence layer that keeps agent-driven development honest"
readme = "README.md"
requires-python = ">=3.11"
# The engine is copyleft; the guidance the installer copies into other repos is
# MIT (GUIDANCE-MIT.md). ADR 0015 retires the engine, so nothing is built or
# distributed from here any more — this declares the licence of the repo's own
# remaining code (`scripts/`), which the carve-out does not cover.
license = "AGPL-3.0-only"
authors = [{ name = "Scott Luengen" }]

# No runtime dependencies. ADR 0015 replaces the runtime with deterministic
# gates and agent-host hooks; `scripts/` is stdlib only, and everything the gate
# needs is in the `dev` extra below.

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.3",
    # The gate's parallel stage (#358). Deliberately not wired into `addopts`:
    # parallelism belongs to the gate, not to an ad-hoc `pytest <file>::<test>`,
    # which stays serial, live-output and debuggable.
    "pytest-xdist>=3.5",
    "ruff>=0.1.6",
    "mypy>=2.0.0",
]

# This repo is no longer a distributable Python package (ADR 0015): there is no
# importable module, no console script, and nothing to build a wheel from. The
# whole gate still runs through `uv run --extra dev`, which needs a venv — so
# tell uv to build the environment without attempting to install the project
# itself. Without this, `uv sync` looks for a build backend and fails.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# No marker survives this repo's own suite — the tier markers went with the
# runtime (#435), and the one `@pytest.mark.fast` in the tree is a string
# literal in a synthetic child project that registers it in its own ini. The
# flag is kept anyway: with no `markers` list, *any* marker is a collection
# error, so a typo'd or reintroduced marker fails loudly instead of warning.
# Per-test timeout (requires pytest-timeout). Prevents a hung test from
# consuming the full CI job budget; the job-level timeout-minutes is a
# secondary backstop.
timeout = 120
