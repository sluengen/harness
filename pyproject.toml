[project]
name = "calibrate-harness"
version = "0.1.0"
description = "Deterministic workflow execution harness for bounded LLM tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Scott Luengen" }]

dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "claude-agent-sdk>=0.1",
    "aiosqlite>=0.19",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1.6",
    "mypy>=1.7",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Typer's idiomatic signature uses ``= typer.Option(...)`` and
# ``= typer.Argument(...)`` in argument defaults (B008). Subprocess calls
# in worktrees.py use ``git`` from PATH with list-form args, never shell=True
# (S603/S607).
"harness/cli/**" = ["B008", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
