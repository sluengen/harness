[project]
name = "harness"
version = "0.2.1"
description = "Deterministic workflow execution harness for bounded LLM tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Scott Luengen" }]

dependencies = [
    "pydantic>=2.5",
    "typer>=0.9",
    "aiosqlite>=0.19",
    "ulid-py>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.3",
    "ruff>=0.1.6",
    "mypy>=2.0.0",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]  # allow `assert` in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# Typer's idiomatic signature uses ``= typer.Option(...)`` and
# ``= typer.Argument(...)`` in argument defaults (B008). Subprocess calls
# in worktrees.py use ``git`` from PATH with list-form args, never shell=True
# (S603/S607).
"harness/cli/**" = ["B008", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Per-test timeout (requires pytest-timeout). Prevents a hung test from
# consuming the full CI job budget; the job-level timeout-minutes is a
# secondary backstop.
timeout = 120
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require external services or a real Docker environment",
    "docker: marks tests that require a running Docker daemon",
]
