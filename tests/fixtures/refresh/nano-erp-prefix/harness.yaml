repo:
  name: nano-erp
  # repo.project is intentionally unset. The harness can scope the Build queue
  # to one project only, and the active front is a Linear INITIATIVE holding
  # several feature projects, so state does the gating instead: only Todo is
  # pulled, and everything parked (the Hideaway project) is Backlog. See
  # "One front at a time" below.
tracker: linear
tracker_address:
  team: ERP
assessment_project: Platform audit
stack:
  language: TypeScript 7 (strict NodeNext ESM; Node.js >=24.18.0)
  backend: Express, pg, Graphile Worker, PostgreSQL RLS, Supabase Auth
  frontend: React 18, Vite, Tailwind (frontend/ npm workspace; same-origin Express delivery)
commands:
  install: "npm install"
  lint: "npm run lint"
  typecheck: "npm run typecheck"
  test: "npm run test"
  test_one: "npm run test:compiled -- --test-name-pattern '<name>'"
  verify: "npm run verify"
  frontend_verify: "npm run frontend:verify"
  frontend_dev: "npm run dev --workspace @nano-erp/frontend"
  build: "npm run build"
  db_generate: "npm run db:generate"
  db_check: "npm run db:check"
  migrate: "npm run migrate"
  worker_migrate: "npm run worker:migrate"
  start: "npm start"
  worker: "npm run worker"
  local_up: "make local-up"
  local_down: "make local-down"
  local_reset: "make local-reset"
  local_smoke: "npm run smoke:local"
branches:
  integration: dev
  staging: staging
  release: main
loop:
  max_review_cycles: 5
queue:
  # The bounds the queue is pulled against, adopted at harness@8.0.0. A
  # project's queue is its Todo, In Progress and In Review tickets with held
  # ones excluded; a filing with no free slot lands in Backlog, and a close is
  # what frees one. Nothing already in flight is demoted to make room.
  wip_limit: 6
  active_projects: 3
  project_field: project
layers:
  design_system: true
  feature_specs: true
paths:
  source: src/
  frontend: frontend/
  design_system: design/
  tests: test/
  migrations: drizzle/
  specs: specs/
  proposals: specs/proposals/
  features: specs/features/
  decisions: specs/architecture-principles.md
conventions:
  commit_format: "conventional commits — type(scope): description"
tools:
  linear_cli: "GraphQL via curl (source .env for LINEAR_API_KEY)"
architecture_watchlist:
  files:
    - frontend/src/routes/AdminOrganisationDetailPage.tsx
    - src/server.ts
    - src/db/session.ts
    - src/auth/resolve.ts
    - drizzle/0000_baseline.sql
env:
  file: .env
  source: .env.example
  linear_token: LINEAR_API_KEY
