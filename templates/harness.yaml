# The repo's Harness configuration. `/harness:hydrate` writes it from the
# interview where the repo does not already carry one, and it is repo-owned from
# that moment. One reader parses it: `scripts/harness-config.js`.
#
# Replace every {placeholder}. Keys the repo invents are kept as written —
# nothing here is translated, so a repo may declare more than the plugin reads.

repo:
  name: {name}
  project: {project}
tracker: {github | linear | none}
stack:
  language: {language and version}
commands:
  install: "{install command}"
  lint: "{lint command}"
  typecheck: "{typecheck command}"
  test: "{test command}"
  test_one: "{single-test command}"
  verify: "{the canonical gate — one command that decides green}"
branches:
  integration: {dev}
  release: {main}
  # staging: only where something deploys to a staging environment (ADR 0003 as amended)
loop:
  max_review_cycles: 3
queue:
  # The bounds the queue is pulled against. A project's queue is its Todo,
  # In Progress and In Review tickets with held ones excluded; a filing with no
  # free slot lands in Backlog, and a close is what frees one.
  wip_limit: 6
  active_projects: 3
  # Where a ticket's project is read from: `project` (Linear), `milestone`
  # (GitHub), or `none` where the repo is its own single queue.
  project_field: {project | milestone | none}
  # Optional per-project override, one flat key per project:
  # projects.{project name}.wip_limit: 8
layers:
  design_system: false
  feature_specs: true
paths:
  tests: {tests/}
  proposals: specs/proposals/
  features: specs/features/
  decisions: specs/decisions/
  # Both belong to the design layer: uncomment and fill them where
  # `layers.design_system` is on, and leave them commented where it is off.
  # One directory each, never a list — `scripts/harness-config.js` reads this
  # block as scalars, so a sequence or a `{placeholder}` left here makes the
  # whole `paths:` map unreadable, and `paths.tests` goes with it.
  # design_system: design/      # where this repo's design system lives
  # ui_source: src/             # the UI source root the design rule binds to
env:
  file: .env
