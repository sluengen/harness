name: implement_feature_loop
version: 1
description: >
  Take a feature description, set up an isolated worktree, then loop
  implement -> pytest until tests pass (or 5 iterations). If tests pass,
  merge the worktree back to base; otherwise cancel the run (the gate's
  on_fail: cancel halts before the cleanup/merge step runs).

inputs:
  feature_description:
    type: string
  base_branch:
    type: string
    default: dev

steps:
  # 1. Isolated worktree for the loop body's file mutations.
  - id: setup-worktree
    type: worktree
    action: create
    base: $inputs.base_branch
    writes: [worktree_path, worktree_branch]

  # 2. Alternate implement (AI, mutates files) and run-tests (script,
  #    writes tests_pass) until tests pass or we hit max_iterations.
  - id: implement-and-test
    type: loop
    loop:
      max_iterations: 5
      until: state.tests_pass == True
      steps:
        - id: implement
          type: ai
          prompt: prompts/standard/implement.j2
          template_vars:
            task: "$inputs.feature_description"
          allowed_tools: [Read, Write, Edit, Bash]
          cwd: $state.worktree_path
          writes_files: true
          writes: []

        - id: run-tests
          type: script
          command: pytest -x
          cwd: $state.worktree_path
          contract:
            tests_pass: boolean
          writes: [tests_pass]

  # 3. Gate: only proceed to merge if the loop terminated with passing tests.
  #    on_fail: cancel halts the run (no merge); on pass we fall through.
  - id: gate-tests-pass
    type: check
    expr: state.tests_pass == True
    on_fail: cancel

  # 4. Tests passed — merge the worktree branch back into the base branch.
  - id: cleanup-merge
    type: worktree
    action: cleanup
    policy: merge_to_base
