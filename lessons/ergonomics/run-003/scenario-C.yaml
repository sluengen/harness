name: implement_with_test_loop
version: 1
description: >
  Take a feature description, set up an isolated worktree, then loop:
  implement the feature (AI mutates files), run pytest (script captures
  pass/fail). Exit when tests pass or after 5 iterations. On pass: commit
  and fast-forward merge into the base branch; on fail: cancel.

inputs:
  feature_description:
    type: string
  base_branch:
    type: string
    default: dev

steps:
  - id: setup-worktree
    type: worktree
    action: create
    base: $inputs.base_branch
    contract:
      worktree_path: string
      worktree_branch: string
    writes: [worktree_path, worktree_branch]

  - id: implement-and-test
    type: loop
    loop:
      max_iterations: 5
      until: state.tests_pass
      steps:
        - id: implement
          type: ai
          prompt: prompts/standard/implement.j2
          template_vars:
            task: "$inputs.feature_description"
            constraints: "Keep the diff focused. Update or add tests for the change. The pytest suite must pass before this work is considered complete."
          allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
          cwd: $state.worktree_path
          writes_files: true
          writes: []

        - id: run-tests
          type: script
          runtime: bash
          command: |
            set +e
            cd "$state.worktree_path"
            pytest -x > /tmp/pytest-output.txt 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              printf '%s' '{"tests_pass": true}'
            else
              printf '%s' '{"tests_pass": false}'
            fi
          contract:
            tests_pass: boolean
          writes: [tests_pass]

  - id: gate-on-tests
    type: check
    expr: state.tests_pass == True
    on_fail: cancel

  - id: commit-changes
    type: script
    runtime: bash
    command: |
      cd "$state.worktree_path"
      git add -A
      git commit -m "feat: $inputs.feature_description"
    writes: []

  - id: teardown-worktree
    type: worktree
    action: cleanup
    policy: merge_to_base
