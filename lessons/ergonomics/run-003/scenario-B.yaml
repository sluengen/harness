name: ticket_fix
version: 1
description: >
  Take a Linear ticket ID, create a worktree off main, have an AI agent
  investigate and apply a fix (with tests), have a separate AI reviewer
  evaluate the diff against correctness/test-coverage/regression-risk.
  On PASS, commit and push the branch and fast-forward the base. On FAIL,
  cancel the run (worktree is left for inspection by virtue of the cancel).

inputs:
  ticket_id:
    type: string
  base_branch:
    type: string
    default: main

steps:
  # ---------- Stage 1: intake / worktree ----------
  - id: setup-worktree
    type: worktree
    action: create
    base: $inputs.base_branch
    contract:
      worktree_path: string
      worktree_branch: string
    writes: [worktree_path, worktree_branch]

  # ---------- Stage 2: build (investigate + fix + tests) ----------
  - id: investigate-and-fix
    type: ai
    prompt: prompts/standard/implement.j2
    template_vars:
      task: >
        Investigate Linear ticket $inputs.ticket_id and apply a fix in this
        worktree. Read the ticket (via the Linear sync tooling or referenced
        files), identify the root cause, implement the change, and add or
        update tests that exercise the fix. Run the tests and confirm they
        pass before submitting.
      constraints: >
        Keep the diff focused on the ticket — no drive-by refactors. Do not
        modify unrelated files. Do not add new dependencies unless strictly
        required by the fix.
    allowed_tools: [Read, Grep, Glob, Write, Edit, Bash]
    cwd: $state.worktree_path
    writes_files: true
    writes: []

  # ---------- Stage 3: review (AI verdict + gating check) ----------
  - id: review-diff
    type: ai
    prompt: prompts/standard/review.j2
    template_vars:
      criteria: "correctness, test coverage, regression risk"
    allowed_tools: [Read, Grep, Glob, Bash]
    cwd: $state.worktree_path
    contract:
      status:
        type: string
        enum: [PASS, FAIL]
      findings:
        type: list
        of:
          severity: string
          description: string
    writes: [status, findings]

  - id: gate-on-review
    type: check
    expr: state.status == "PASS"
    on_fail: cancel

  # ---------- Stage 4: outtake (commit + push + ff-merge base) ----------
  - id: commit-and-push
    type: script
    command: |
      set -euo pipefail
      git add -A
      git commit -m "fix($inputs.ticket_id): apply reviewed fix"
      git push -u origin "$state.worktree_branch"
    cwd: $state.worktree_path
    contract:
      pushed: boolean
    writes: [pushed]

  - id: cleanup-worktree
    type: worktree
    action: cleanup
    policy: merge_to_base
