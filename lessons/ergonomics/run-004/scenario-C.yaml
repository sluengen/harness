name: implement_with_test_loop
version: 1
description: |
  Take a feature description, set up an isolated worktree, then iterate
  implement → run-tests up to 5 times. On test pass, commit and merge
  back to base. On failure (loop exhaustion), cancel without merging.

inputs:
  feature_description:
    type: string
  base_branch:
    type: string
    default: dev

steps:
  # 1. Isolated worktree. Writes worktree_path + worktree_branch to BaseState.
  - id: setup-worktree
    type: worktree
    action: create
    base: $inputs.base_branch

  # 2. Iterate implement + run-tests until pytest passes (or max 5 tries).
  - id: implement-and-test
    type: loop
    loop:
      max_iterations: 5
      until: state.tests_pass
      steps:
        - id: implement
          type: ai
          prompt: prompts/standard/implement.j2
          template_vars:
            task: "$inputs.feature_description"
            constraints: "Stay within the worktree. Update or add tests so pytest exercises the change."
          allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
          cwd: $state.worktree_path
          writes_files: true
          writes: []          # mutates files only; no state output

        - id: run-tests
          type: script
          command: pytest -x
          cwd: $state.worktree_path
          contract:
            tests_pass: boolean
          writes: [tests_pass]

  # 3. Gate. Per AUTHORING.md §10 (last row), single-direction branching:
  #    on PASS we fall through to the success-path cleanup; on FAIL the
  #    workflow halts here and the worktree is left untouched (no merge).
  - id: gate-tests-passed
    type: check
    expr: state.tests_pass == True
    on_fail: cancel

  # 4. Success path: commit any uncommitted work on the worktree branch so
  #    the subsequent merge_to_base cleanup has commits to fast-forward.
  - id: commit-changes
    type: script
    command: |
      cd "$state.worktree_path"
      git add -A
      git diff --cached --quiet || git commit -m "feat: $inputs.feature_description"
    contract:
      committed: boolean
    writes: [committed]

  # 5. Cleanup with merge_to_base — fast-forwards $inputs.base_branch to
  #    the worktree branch and removes the worktree.
  - id: cleanup-merge
    type: worktree
    action: cleanup
    policy: merge_to_base
