# Scenario B — code-mutating fix workflow for a Linear ticket.
# Pipeline: worktree create + investigate -> build (implement + tests) ->
# AI review -> on PASS commit/push and merge the worktree to base; on FAIL
# the check cancels the run (no commit, no push, worktree left for inspection
# by virtue of cancellation halting the run before cleanup).
name: linear_ticket_fix
version: 1
description: >
  Take a Linear ticket ID, set up an isolated worktree off main, have an AI
  investigate and apply a fix (with tests), review the result, and on PASS
  commit + push + fast-forward main to the worktree branch.

inputs:
  ticket_id:
    type: string
  base_branch:
    type: string
    default: main

steps:
  # ---------- Stage 1: intake / worktree -------------------------------------
  - id: setup-worktree
    type: worktree
    action: create
    base: $inputs.base_branch

  - id: investigate
    type: ai
    prompt: prompts/standard/analyze.j2
    template_vars:
      task: >
        Read Linear ticket $inputs.ticket_id (assume the description is in the
        ticket body). Investigate the relevant code in the worktree at
        $state.worktree_path and produce a structured summary of the bug and
        the proposed fix approach.
      tools_hint: "Prefer Read/Grep/Glob. Do not modify files in this step."
    cwd: $state.worktree_path
    allowed_tools: [Read, Grep, Glob]
    contract:
      summary: string
      proposed_fix: string
    writes: [summary, proposed_fix]

  # ---------- Stage 2: build (implement + tests) -----------------------------
  - id: implement-fix
    type: ai
    prompt: prompts/standard/implement.j2
    template_vars:
      task: >
        Apply the fix for Linear ticket $inputs.ticket_id described in
        $state.proposed_fix. Add or update tests that cover the regression.
      constraints: >
        Keep the change minimal and focused on the bug described in
        $state.summary. No new third-party dependencies.
    cwd: $state.worktree_path
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    writes_files: true
    writes: []

  - id: run-tests
    type: script
    command: pytest -x
    cwd: $state.worktree_path
    contract:
      tests_pass: boolean
    writes: [tests_pass]

  - id: gate-tests
    type: check
    expr: state.tests_pass == True
    on_fail: cancel

  # ---------- Stage 3: review ------------------------------------------------
  - id: review
    type: ai
    prompt: prompts/standard/review.j2
    template_vars:
      criteria: "correctness, test coverage, regression risk"
    cwd: $state.worktree_path
    allowed_tools: [Read, Grep, Glob, Bash]
    contract:
      status:
        type: string
        enum: [PASS, FAIL]
      findings:
        type: list
        of:
          severity: string
          description: string
    writes: [status, findings]

  - id: gate-review
    type: check
    expr: state.status == "PASS"
    on_fail: cancel

  # ---------- Stage 4: outtake (commit, push, merge) -------------------------
  - id: commit-and-push
    type: script
    cwd: $state.worktree_path
    command: |
      git add -A
      git commit -m "fix($inputs.ticket_id): $state.summary"
      git push -u origin $state.worktree_branch
    contract:
      pushed: boolean
    writes: [pushed]

  - id: teardown-worktree
    type: worktree
    action: cleanup
    policy: merge_to_base
