name: github_pr_release_notes
version: 1
description: Pull recently-merged GitHub PRs and summarise into release notes markdown.

inputs:
  since_days:
    type: integer
    default: 7
  repo:
    type: string
    default: ""
  output_path:
    type: string
    default: ""

steps:
  - id: fetch-prs
    type: script
    command: >-
      bash -c '
      set -euo pipefail;
      since_date=$(date -u -v-$inputs.since_daysd +%Y-%m-%d 2>/dev/null || date -u -d "$inputs.since_days days ago" +%Y-%m-%d);
      repo_arg="";
      if [ -n "$inputs.repo" ]; then repo_arg="--repo $inputs.repo"; fi;
      gh pr list $repo_arg --state merged --search "merged:>=$since_date" --limit 200
      --json number,title,body,url,mergedAt,author,labels
      | jq "{prs: [.[] | {number, title, body, url, mergedAt, author: (.author.login // \"\"), labels: [.labels[].name]}]}"
      '
    contract:
      prs:
        type: list
        of:
          number: integer
          title: string
          body: string
          url: string
          mergedAt: string
          author: string
          labels:
            type: list
            of: string
    writes: [prs]

  - id: summarise
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/standard/summarize.j2
    template_vars:
      subject: "GitHub PRs merged in the last $inputs.since_days days: $state.prs"
      length: "release-notes markdown grouped by type (Features, Bug fixes, Improvements, Chores). Reference each PR by #number and link via its url."
    allowed_tools: [Read]
    contract:
      release_notes: string
    writes: [release_notes]

  - id: write-file
    type: script
    runtime: python
    script: scripts/write_release_notes.py
    args: ["--run-id", "$state.run_id", "--output-path", "$inputs.output_path"]
    contract:
      output_path: string
    writes: [output_path]
