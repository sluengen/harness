name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        # Tests are excluded from mypy: the 89 errors there are a known
        # backlog; scope is harness + intake (production code only).
        run: uv run mypy harness intake

      - name: Run tests
        # pytest-timeout kills any single test that stalls past 120 s;
        # the job-level timeout-minutes: 10 is a secondary backstop.
        run: uv run pytest
