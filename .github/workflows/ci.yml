name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared here rather than inherited from the repo-level
# default: a default widened in the GitHub UI silently widens every job that
# declares nothing, and this workflow runs on every push to main and dev. Lint-and-test
# needs only the checkout. Pinned by tests/unit/test_ci_workflow_permissions.py.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A backstop, not a budget: it must exceed the whole gate with room to
    # spare. The gate runs in well under a minute since #435 deleted the docker
    # stage that used to build an uncached image under a 600s allowance.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1. The feature-spec currency
          # guard (#280) asks git for the last commit touching each
          # specs/features/*.md; in a shallow clone git answers with the graft
          # boundary, so every spec reads as touched at HEAD and the run goes
          # red on whichever specs were not edited that day (#326). Pinned by
          # tests/unit/test_ci_workflow_full_history.py.

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        # pytest-timeout kills any single test that stalls past 120 s
        # (pyproject.toml). The job-level timeout-minutes above is a secondary
        # backstop and must stay above it.
        run: bash scripts/verify.sh
