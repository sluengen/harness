name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared here rather than inherited from the repo-level
# default: a default widened in the GitHub UI silently widens every job that
# declares nothing, and this workflow runs on every push to main. Lint-and-test
# needs only the checkout. Pinned by tests/unit/test_ci_workflow_permissions.py.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Must exceed the longest single test. The docker integration module builds
    # the image with no layer cache and is allowed 600s (CAL-1110); at the old
    # 10 minutes the job budget and that one test were the same number, so the
    # backstop would fire before the thing it backstops. Pinned by
    # tests/unit/test_timeout_budgets_coherent.py.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        # pytest-timeout kills any single test that stalls past 120 s — except
        # the docker integration module, which overrides to 600 s for its
        # uncached image build (CAL-1110). The job-level timeout-minutes is a
        # secondary backstop and must stay above both.
        run: bash scripts/verify.sh
