name: CI

on:
  push:
    branches: [main, dev]
  # Pull-request runs are raised for `dev` only (#485). The nightly promotion
  # opens a `dev -> main` pull request using GITHUB_TOKEN, and a PR opened by a
  # workflow with that token produces runs in an approval-required state — which
  # nothing unattended can approve. Including `main` here would put a second,
  # permanently unapproved `lint-and-test` run on the very commit whose green
  # run `main`'s protection reads. Pushes to `main` still run the gate, so this
  # removes a duplicate rather than coverage; a human PR into `main` from any
  # other branch gets no run and therefore cannot merge, which is fail-closed
  # and deliberate. Pinned by tests/unit/test_nightly_promotion_workflow.py.
  pull_request:
    branches: [dev]
  # A manual re-raise, for the one failure the two triggers above cannot recover
  # from. The nightly promotion polls for a `lint-and-test` check-run on the
  # candidate SHA, and `main`'s protection requires the same check; both are
  # satisfied only by the run the `push: dev` trigger raises. On 2026-09-13 that
  # run (34748466306) was accepted by GitHub and never dispatched — zero jobs,
  # `updated_at` never moving off `created_at` — and it could not be cancelled,
  # force-cancelled or re-run: those three endpoints reported the run completed,
  # not yet queued, and already running respectively. With no way to re-raise the
  # check, `dev@901e139` was unpromotable while it stayed the tip, and each
  # nightly burned its full 1200 s poll rediscovering that.
  #
  # This adds the missing lever and nothing else: dispatching runs the same
  # single `lint-and-test` job against the chosen ref, so the check lands on that
  # ref's tip. It raises no new authority — `permissions:` below is unchanged and
  # dispatch is restricted to those who can already push here.
  #
  # Placement is load-bearing: `_ci_trigger_branches` in
  # tests/unit/test_nightly_promotion_workflow.py matches `^  <event>:` followed
  # by `branches: [...]`, so a trigger carrying no branch filter must not sit
  # between an event and its filter.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared here rather than inherited from the repo-level
# default: a default widened in the GitHub UI silently widens every job that
# declares nothing, and this workflow runs on every push to main and dev. Lint-and-test
# needs only the checkout.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A backstop, not a budget: it must exceed the whole gate with room to
    # spare. The gate runs in well under a minute since #435 deleted the docker
    # stage that used to build an uncached image under a 600s allowance.
    timeout-minutes: 20

    steps:
      # Full history, and as of #588 **no gate stage requires it**. It was added
      # by #580 for the start-of-cycle version guard, which compared the index
      # against the branch named under `branches.release` and skipped on every
      # push under the bare shallow checkout that stood here. #588 deleted that
      # guard and the cycle-start obligation with it, and a sweep at that ticket
      # found no other gate-time reader of a release ref: every remaining test
      # that touches git either reads the index or builds its own scratch repo.
      #
      # The key stays, and that is a decision rather than an oversight. Removing
      # it is an untested change to the one checkout every gate run depends on,
      # against a saving this repo does not have to make (1781 commits, 22 MB of
      # history at #580); the best change is the one not made (P0). What is gone
      # with the guard is the *guard on this key* — nothing now fails if a later
      # edit re-shallows the clone, which is correct while nothing reads it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        # pytest-timeout kills any single test that stalls past 120 s
        # (pyproject.toml). The job-level timeout-minutes above is a secondary
        # backstop and must stay above it.
        run: bash scripts/verify.sh
