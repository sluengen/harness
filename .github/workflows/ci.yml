name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared here rather than inherited from the repo-level
# default: a default widened in the GitHub UI silently widens every job that
# declares nothing, and this workflow runs on every push to main and dev. Lint-and-test
# needs only the checkout.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A backstop, not a budget: it must exceed the whole gate with room to
    # spare. The gate runs in well under a minute since #435 deleted the docker
    # stage that used to build an uncached image under a 600s allowance.
    timeout-minutes: 20

    steps:
      # The default shallow checkout: no gate stage reads git history since
      # the feature-spec currency stage was retired (ADR 0017; the nightly
      # keeps its own full fetch for the fast-forward ancestry check).
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        # pytest-timeout kills any single test that stalls past 120 s
        # (pyproject.toml). The job-level timeout-minutes above is a secondary
        # backstop and must stay above it.
        run: bash scripts/verify.sh
