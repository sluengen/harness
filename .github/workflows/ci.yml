name: CI

on:
  push:
    branches: [main, dev]
  # Pull-request runs are raised for `dev` only (#485). The nightly promotion
  # opens a `dev -> main` pull request using GITHUB_TOKEN, and a PR opened by a
  # workflow with that token produces runs in an approval-required state — which
  # nothing unattended can approve. Including `main` here would put a second,
  # permanently unapproved `lint-and-test` run on the very commit whose green
  # run `main`'s protection reads. Pushes to `main` still run the gate, so this
  # removes a duplicate rather than coverage; a human PR into `main` from any
  # other branch gets no run and therefore cannot merge, which is fail-closed
  # and deliberate. Pinned by tests/unit/test_nightly_promotion_workflow.py.
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared here rather than inherited from the repo-level
# default: a default widened in the GitHub UI silently widens every job that
# declares nothing, and this workflow runs on every push to main and dev. Lint-and-test
# needs only the checkout.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # A backstop, not a budget: it must exceed the whole gate with room to
    # spare. The gate runs in well under a minute since #435 deleted the docker
    # stage that used to build an uncached image under a 600s allowance.
    timeout-minutes: 20

    steps:
      # Full history, for one stage that reads outside the pushed ref: the
      # start-of-cycle version guard (tests/unit/test_release_version_cycle.py)
      # compares the index against the branch named under `branches.release`,
      # and where no ref names that role it reports NO_RELEASE_REF and *skips*.
      # Under the bare shallow checkout that stood here, it therefore skipped on
      # every push, leaving the version bump no control but the builder's local
      # gate — while the spine puts the controls of record in CI (#580).
      #
      # The guard itself must keep not fetching: a gate that reaches the network
      # is neither deterministic nor offline-runnable, so the ref is made present
      # before the stage runs rather than by it. `fetch-depth: 0` is the checkout
      # action's own key; a narrow fetch of the release branch would serve the
      # guard's three reads, none of which needs history, but it re-implements
      # ref fetching and puts a `harness.yaml` read inside CI for a saving this
      # repo does not have to make (1781 commits, 22 MB of history at #580).
      # Pinned, with the count of checkout steps, by
      # tests/unit/test_nightly_promotion_workflow.py.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        # pytest-timeout kills any single test that stalls past 120 s
        # (pyproject.toml). The job-level timeout-minutes above is a secondary
        # backstop and must stay above it.
        run: bash scripts/verify.sh
