name: Nightly staging promotion

# GitHub Actions schedules are UTC. Australia/Brisbane is UTC+10 year-round, so
# 14:00 UTC is midnight local time. Scheduled workflows are read from the default
# branch; this job explicitly checks out `dev`, the branch it promotes — and that
# checkout is also where the promotion step's script comes from, so this file and
# the shell it invokes are read from different refs (scripts/promotion-step.sh).
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  # Do not cancel an in-flight candidate: it may be running the verification
  # gate, and a second candidate would race its guarded staging ref update.
  group: nightly-dev-to-staging
  cancel-in-progress: false

# The step advances only the derived staging ref, as a fast-forward; it has no
# pull-request, package, OIDC, or broader grant.
permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          # The canonical gate reads history when checking feature-spec currency.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # The gate runs entirely through `uv run --extra dev`, so the environment
      # it needs is still installed here rather than resolved mid-gate.
      - name: Install the gate toolchain
        run: uv sync --extra dev --frozen

      # Actions runners do not provide a repository-local author by default, and
      # a git operation that needs one fails obscurely when it is missing.
      - name: Configure promotion commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Promote the gated candidate
        shell: bash
        # The step's logic lives in the script so a test can execute it rather
        # than read it (specs/architecture-principles.md -> CI logic lives in a
        # script, not in a `run:` block). Nothing may be appended here:
        # `::error::` annotations are interpreted only on the step's own stdout,
        # so a `| tee` would silence them.
        run: bash scripts/promotion-step.sh
