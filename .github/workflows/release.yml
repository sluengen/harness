name: Release image

# Build the runtime image (docker/Dockerfile) and publish it to GHCR as
# ghcr.io/sluengen/harness:<version>.
#
# Gated behind a version-tag push: nothing runs on branch pushes or pull
# requests, so this workflow is INERT until a human cuts the first tagged
# release (see RELEASING.md → Tagging: `git tag -s v<X.Y.Z>` + `git push`).
#
# Before anything is published the workflow enforces three release invariants:
#   1. the verification gate (scripts/verify.sh) passes on the tagged commit;
#   2. the tagged commit is contained in origin/main (the dev → main release
#      boundary, D7 — consumers pull main, never in-flight dev);
#   3. the git tag agrees with the static packaged version.
#
# Auth is the built-in GITHUB_TOKEN with `packages: write` — no PAT — so the
# package stays owned by and linked to sluengen/harness. The package is private
# by GHCR default; enabling "Inherit access from repository" (a one-time
# GitHub-UI toggle that only exists after the first push) is a deferred human
# runbook step, not part of this workflow.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same gate CI runs on main, re-run on the exact tagged commit so a
  # failing commit can never become an immutable release image.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Run verification gate
        run: bash scripts/verify.sh

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the tagged commit's ancestry against main is knowable.
          fetch-depth: 0

      # Enforce the dev → main release boundary: a `v*` tag can point at any
      # commit (including an unmerged dev / feature branch), so refuse to publish
      # unless the tagged commit is contained in origin/main.
      - name: Verify tag is a released main commit
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag $GITHUB_REF_NAME ($GITHUB_SHA) is not contained in origin/main; cut releases from main (RELEASING.md)"
            exit 1
          fi

      # Fail fast before any push: the registry tag is derived from the git tag,
      # but the image bakes in the static pyproject / harness.__version__. Guard
      # that they agree so a `v0.2.0` tag can never publish an image that reports
      # `harness 0.1.0` (RELEASING.md requires the version bump; this enforces it).
      - name: Verify tag matches packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject_version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          pkg_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' harness/__init__.py | head -1)"
          if [ "$tag" != "$pyproject_version" ] || [ "$tag" != "$pkg_version" ]; then
            echo "::error::release tag v$tag disagrees with packaged version (pyproject=$pyproject_version, harness.__version__=$pkg_version)"
            exit 1
          fi
          echo "Release version $tag verified against pyproject and harness.__version__."

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sluengen/harness
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
