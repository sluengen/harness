# The harness's OWN autonomous loop, run in the cloud.
#
# WS3 of the harden-loop-layer proposal (CAL-908). See the decision record:
#   specs/decisions/0001-cloud-runnable-harness-loop.md
#
# This wires the harness's own Build/Quality loops onto a cloud schedule so the
# overnight sweep does not depend on a laptop staying open. It is the CAPSTONE,
# sequenced after the WS1 spend-breakers (CAL-906) — an unbounded loop must not
# run unattended in the cloud, so the breakers land first and the ledger-backed
# review-cycle ceiling + wall-clock budget bound every run this workflow starts.
#
# WHY THIS IS A SECRETS + ENGINE JOB, NOT A RE-ARCHITECTURE:
#   * scripts/verify.sh already runs green on ubuntu-latest in CI — the gate is
#     Linux-proven; there are zero Xcode/Swift/macOS/Homebrew dependencies.
#   * the verbs run in-process off the native `harness` console script
#     (pyproject [project.scripts]) — no Docker-in-Docker, no ~/bin/harness.
#   * the only Mac-local pieces were credential *sourcing* (Keychain / .env /
#     ~/.codex); each becomes a standard GitHub Actions secret below.
#   * the reclaim pre-flight keys entirely on Linear, so a fresh clone with no
#     local ledger reconciles stranded runs before picking work.
#
# PER-TARGET-REPO GATE RULE (load-bearing — see the ADR): this workflow makes the
# HARNESS'S OWN loop cloud-runnable. It does NOT make every self-hosting target
# repo cloud-runnable. A target whose gate needs Xcode/macOS tooling (e.g. an iOS
# repo) must stay local or run on a macos-latest runner. Cloud-viability is set
# by the *target's* gate, not the harness's auth.

name: harness-loop

on:
  # Autonomous overnight sweep. GitHub Actions cron is UTC; 07:00 UTC is an
  # overnight slot for the operator. The overnight sweep only needs to run
  # nightly — the proposal notes a 1-hour-minimum interval is fine here, and
  # this is coarser still. Scheduled triggers fire only from the default branch.
  schedule:
    - cron: "0 7 * * *"
  # On-demand run so the operator can perform the first, demonstrating run the
  # moment the secrets are provisioned, without waiting for the cron.
  workflow_dispatch:
    inputs:
      loop:
        description: "Which loop to run"
        type: choice
        default: build
        options:
          - build
          - quality

# The loop mutates Linear + pushes to dev; never run two overnight sweeps at once.
concurrency:
  group: harness-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # secondary backstop; the per-run wall-clock breaker (90m, CAL-906) is primary
    permissions:
      contents: write # the loop's close verb pushes the merged branch to dev

    env:
      # Credentials as cloud secrets — replacing the Mac-local Keychain / .env /
      # ~/.codex sourcing. The verbs read these straight from the environment
      # (harness/linear.py reads LINEAR_API_KEY from os.environ).
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Fallback auth if the OAuth token is not used; either satisfies the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      # A clean clone every run — this is exactly the fresh-clone / no-local-DB
      # case the Linear-keyed reclamation is designed to reconcile.
      - uses: actions/checkout@v4
        with:
          ref: dev # feature branches base from and merge back into dev
          fetch-depth: 0 # reclaim --resume may fetch a preserved WIP branch

      # Fail fast and CLEANLY if the repo has not had its secrets provisioned:
      # an unconfigured fork/clone must no-op, not error-spam the overnight cron.
      - name: Require credentials
        run: |
          if [ -z "${LINEAR_API_KEY}" ]; then
            echo "::notice::LINEAR_API_KEY secret is not set — nothing to do. " \
                 "Provision the loop's secrets to enable the cloud schedule " \
                 "(see specs/decisions/0001-cloud-runnable-harness-loop.md)."
            exit 0
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Native in-process install of the `harness` console script — no Docker.
      - name: Install the harness (native entry point)
        run: uv tool install .

      # STEP 0 of the routine, hoisted so the CLI runs it even before the agent
      # starts: revert any ticket stranded In Progress by a dead predecessor back
      # to Todo. Keyed on Linear (not the absent local ledger) so it reconciles a
      # fresh clone. Best-effort — a sweep that finds nothing stale is a clean no-op.
      - name: Reclaim stranded runs (Linear-keyed pre-flight)
        run: harness reclaim --stale --project "Harness v3"

      # Drive the versioned loop with the Claude Code CLI headless. The CLAUDE
      # review engine is the default and the only cloud-viable one: Codex's
      # ~/.codex subscription auth does not travel as a secret and is bwrap-blocked
      # in-container anyway (CAL-866), so this loop never selects the Codex engine.
      # The prompt is the versioned routine; the pick/actionability logic lives in
      # the work-discovery skill it invokes (version the logic, not the schedule).
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run the harness loop (Claude engine)
        run: |
          LOOP="${{ github.event.inputs.loop || 'build' }}"
          claude -p "/harness routine ${LOOP}" --permission-mode acceptEdits

      # Housekeeping: reclaim merged worktrees + their branches, and orphaned dirs
      # left by runs that died before teardown. Best-effort and idempotent.
      - name: Reclaim merged worktrees
        if: always()
        run: harness worktrees cleanup --merged --age 7d || true
