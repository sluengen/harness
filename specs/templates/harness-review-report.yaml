# Harness review report template
#
# Used by the harness-reviewer agent when producing a coherence report.
# File naming: reviews/YYYY-MM-DD-harness-review-report.yaml
#
# Severity levels: Critical | High | Medium | Low
# (see harness-reviewer.md for severity definitions)
#
# Findings are only included if there is specific evidence:
# file name, line number, or concrete pattern observed.
# Do not include theoretical risks or style preferences.

report:
  date: "YYYY-MM-DD"
  agent: harness-reviewer
  scope: >
    [One paragraph describing what was assessed: which harness files were read,
    which scope areas were covered. Be explicit about anything skipped and why.]

  summary: >
    [Two to four sentences. Overall coherence signal: how many findings, at what
    severity, and what the dominant theme is. Do not repeat individual findings
    here — synthesize them. e.g. "Harness coherence is solid. Two medium-severity
    MECE findings around duplicated pipeline rules. No critical wiring errors."]

  finding_count:
    critical: 0
    high: 0
    medium: 0
    low: 0

  # --------------------------------------------------------------------------
  # Section 1: MECE — Single Source of Truth
  # --------------------------------------------------------------------------
  mece:
    assessed: true
    findings:
      - id: MECE-1
        severity: Medium   # Critical | High | Medium | Low
        knowledge: "[The specific rule, process, or constraint that is duplicated]"
        locations:
          - "[file path: line number — source or copy?]"
          - "[file path: line number — source or copy?]"
        description: >
          [What the duplicated knowledge is. Whether one location is clearly the
          source. What the divergence risk is if they fall out of sync.]
        evidence: "[Exact quotes or line references showing the duplication]"
    # If no findings in this section:
    # findings: []
    # notes: "All assessed knowledge has a single source of truth."

  # --------------------------------------------------------------------------
  # Section 2: Lean — Everything Earns Its Keep
  # --------------------------------------------------------------------------
  lean:
    assessed: true
    findings:
      - id: LEAN-1
        severity: Low
        file: "[file path]"
        description: >
          [What is unnecessary: unused section, bloated content, file loaded into
          context that doesn't need it, template with no consumers. Be specific
          about what should be removed or shortened.]
        evidence: "[What you checked to confirm it's unused or unnecessary]"
    # findings: []
    # notes: "All harness files are appropriately sized and referenced."

  # --------------------------------------------------------------------------
  # Section 3: Correct — What's Written Matches What's True
  # --------------------------------------------------------------------------
  correct:
    assessed: true
    findings:
      - id: CORRECT-1
        severity: Medium
        file: "[file path: line number]"
        description: >
          [What the file says vs. what is actually true. e.g. a skill reference
          that points to a nonexistent file, an agent tool list that doesn't match
          the definition, a tech stack detail that has changed.]
        evidence: "[The specific reference and what you found when you checked it]"
    # findings: []
    # notes: "All references verified. No stale or broken links found."

  # --------------------------------------------------------------------------
  # Recommended actions
  #
  # Drafted here for orchestrator consideration — not executed directly.
  # Only include entries for findings rated High or above.
  # --------------------------------------------------------------------------
  recommended_actions:
    - id: "harness-[NNN]-[short-slug]"
      name: "[Short description of the fix]"
      priority: "[P1–P3]"
      principle: "[MECE | Lean | Correct]"
      finding: "[finding id, e.g. MECE-1]"
      files_affected:
        - "[file path]"
      description: >
        [What is wrong, why it matters, and what the fix involves.
        Specific enough to act on without needing to re-read the full report.]
