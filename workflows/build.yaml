name: build
version: 1
description: >
  General-purpose build workflow for harness dog-fooding. Fetches a
  Linear ticket, implements the required changes in an isolated worktree, has a
  second agent review them, and on PASS commits, pushes, and merges to the base
  branch.

inputs:
  linear_id:
    type: string
    pattern: "^[A-Z]+-\\d+$"
    flag: --linear
    required: true
  base_branch:
    type: string
    default: main
    flag: --base-branch

steps:
  - id: setup
    type: worktree
    action: create
    base: $inputs.base_branch
    writes: [worktree_path, worktree_branch]

  - id: implement
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/build/implement.j2
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    writes_files: true
    writes: []

  - id: review
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/build/review.j2
    allowed_tools: [Read, Grep, Glob, Bash]
    contract:
      verdict:
        type: string
        enum: [PASS, FAIL]
      issues:
        type: list
        of: string
    writes: [verdict, issues]

  - id: gate
    type: check
    expr: state.verdict == "PASS"
    on_fail: cancel

  - id: commit-and-push
    type: script
    command: |
      git add -A >&2
      git commit -m "feat($1): implement ticket changes" >&2
      git push -u origin "$2" >&2
      printf '{"commit_sha": "%s"}' "$(git rev-parse HEAD)"
    args: ["$inputs.linear_id", "$state.worktree_branch"]
    contract:
      commit_sha: string
    writes: [commit_sha]

  - id: teardown
    type: worktree
    action: cleanup
    policy: merge_to_base
