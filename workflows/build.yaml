name: build
version: 2
description: >
  General-purpose build workflow for harness dog-fooding. Sets the Linear
  ticket in-progress, fetches ticket content, implements changes in an
  isolated worktree, has a reviewer agent review and author the commit
  message, commits and pushes on PASS, tears down locally, then marks
  the task done.

inputs:
  linear_id:
    type: string
    pattern: "^[A-Z]+-\\d+$"
    flag: --linear
    required: true
  base_branch:
    type: string
    default: main
    flag: --base-branch

steps:
  - id: setup
    type: worktree
    action: create
    base: $inputs.base_branch
    writes: [worktree_path, worktree_branch]

  - id: set-in-progress
    type: script
    command: |
      STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){team{states{nodes{id type}}}}}\"}" \
        | jq -r '.data.issue.team.states.nodes[] | select(.type=="started") | .id' \
        | head -1)
      curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        --data-raw "{\"query\":\"mutation{issueUpdate(id:\\\"$1\\\",input:{stateId:\\\"${STATE_ID}\\\"}){success}}\"}" \
        > /dev/null
      printf '{}'
    args: ["$inputs.linear_id"]
    writes: []

  - id: fetch-ticket
    type: script
    command: |
      curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){title description}}\"}" \
        | jq '{ticket_title: .data.issue.title, ticket_description: (.data.issue.description // "")}'
    args: ["$inputs.linear_id"]
    contract:
      ticket_title: string
      ticket_description: string
    writes: [ticket_title, ticket_description]

  - id: implement
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/build/implement.j2
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    writes_files: true
    writes: []

  - id: review
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/build/review.j2
    allowed_tools: [Read, Grep, Glob, Bash]
    contract:
      verdict:
        type: string
        enum: [PASS, FAIL]
      issues:
        type: list
        of: string
      commit_message: string
    writes: [verdict, issues, commit_message]

  - id: gate
    type: check
    expr: state.verdict == "PASS"
    on_fail: cancel

  - id: commit-and-push
    type: script
    command: |
      git add -A >&2
      git commit -m "$2" >&2
      git push -u origin "$1" >&2
      printf '{"commit_sha": "%s"}' "$(git rev-parse HEAD)"
    args: ["$state.worktree_branch", "$state.commit_message"]
    contract:
      commit_sha: string
    writes: [commit_sha]

  - id: teardown
    type: worktree
    action: cleanup
    policy: delete_unconditionally

  - id: close-task
    type: script
    cwd: "."
    command: |
      STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){team{states{nodes{id type}}}}}\"}" \
        | jq -r '.data.issue.team.states.nodes[] | select(.type=="completed") | .id' \
        | head -1)
      curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        --data-raw "{\"query\":\"mutation{issueUpdate(id:\\\"$1\\\",input:{stateId:\\\"${STATE_ID}\\\"}){success}}\"}" \
        > /dev/null
      printf '{}'
    args: ["$inputs.linear_id"]
    writes: []
