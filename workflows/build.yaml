name: build
version: 1
description: >
  General-purpose build workflow for slate-harness dog-fooding. Fetches a
  Linear ticket, implements the required changes in an isolated worktree, has a
  second agent review them, and on PASS commits, pushes, and merges to the base
  branch.

inputs:
  linear_id:
    type: string
    pattern: "^[A-Z]+-\\d+$"
    flag: --linear
    required: true
  base_branch:
    type: string
    default: main
    flag: --base-branch

steps:
  - id: setup
    type: worktree
    action: create
    base: $inputs.base_branch

  - id: implement
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/standard/implement.j2
    template_vars:
      task: >
        Implement the changes required for Linear ticket $inputs.linear_id.
        Fetch the ticket details from Linear (title, description, acceptance
        criteria), plan the minimal change that satisfies them, apply the change
        in this worktree, and write or update tests. Run the full test suite and
        confirm it passes before submitting.
    allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
    cwd: $state.worktree_path
    writes_files: true
    writes: []

  - id: review
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/standard/review.j2
    template_vars:
      criteria: >
        Correctness relative to Linear ticket $inputs.linear_id acceptance
        criteria, adequate test coverage, focused diff (no drive-by changes),
        no obvious regressions.
    allowed_tools: [Read, Grep, Glob, Bash]
    cwd: $state.worktree_path
    contract:
      verdict:
        type: string
        enum: [PASS, FAIL]
      issues:
        type: list
        of: string
    writes: [verdict, issues]

  - id: gate
    type: check
    expr: state.verdict == "PASS"
    on_fail: cancel

  - id: commit-and-push
    type: script
    cwd: $state.worktree_path
    command: |
      git add -A
      git commit -m "feat($inputs.linear_id): implement ticket changes"
      git push -u origin $state.worktree_branch
      printf '{"commit_sha": "%s"}' "$(git rev-parse HEAD)"
    contract:
      commit_sha: string
    writes: [commit_sha]

  - id: teardown
    type: worktree
    action: cleanup
    policy: merge_to_base
