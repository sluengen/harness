name: build-codex
version: 3
description: >
  General-purpose build workflow for harness dog-fooding. Sets the Linear
  ticket in-progress, fetches ticket content, reads the target project's
  CLAUDE.md, implements changes in an isolated worktree, runs a review loop
  (up to 3 iterations) to catch fixable issues before shipping, commits and
  merges to base on PASS or DEFER, tears down locally, then marks the task done.

  Identical to build.yaml except the review step uses agent: codex.

inputs:
  linear_id:
    type: string
    pattern: "^[A-Z]+-\\d+$"
    flag: --linear
    required: true
  base_branch:
    type: string
    default: dev
    flag: --base-branch
  repo_path:
    type: string
    required: false
    default: "."
    flag: --repo-path
  verify_command:
    type: string
    required: false
    default: "bash scripts/verify.sh"
    flag: --verify-command
  branch_prefix:
    type: string
    required: false
    default: "harness"
    flag: --branch-prefix

steps:
  - id: setup
    type: worktree
    action: create
    base: $inputs.base_branch
    writes: [worktree_path, worktree_branch]

  - id: set-in-progress
    type: script
    command: |
      NODES=$(curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){team{states{nodes{id name type}}}}}\"}" \
        | jq -c '.data.issue.team.states.nodes')
      STATE_ID=$(printf '%s' "$NODES" \
        | jq -r 'map(select(.type=="started")) | (map(select((.name | ascii_downcase) == "in progress")) | first) // first | .id // empty')
      if [ -n "$STATE_ID" ]; then
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          --data-raw "{\"query\":\"mutation{issueUpdate(id:\\\"$1\\\",input:{stateId:\\\"${STATE_ID}\\\"}){success}}\"}" \
          > /dev/null
      fi
      printf '{}'
    args: ["$inputs.linear_id"]
    writes: []

  - id: fetch-ticket
    type: script
    command: |
      curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){title description}}\"}" \
        | jq '{ticket_title: .data.issue.title, ticket_description: (.data.issue.description // "")}'
    args: ["$inputs.linear_id"]
    contract:
      ticket_title: string
      ticket_description: string
    writes: [ticket_title, ticket_description]

  - id: read-target-claude-md
    type: script
    command: |
      content=$(cat "$1/CLAUDE.md" 2>/dev/null || echo "(no CLAUDE.md found)") && jq -n --arg content "$content" '{"target_claude_md": $content}'
    args: ["$inputs.repo_path"]
    contract:
      target_claude_md: string
    writes: [target_claude_md]

  - id: fix-loop
    type: loop
    loop:
      max_iterations: 3
      until: 'state.verdict != "FAIL"'
      on_exhaust: continue
      steps:

        - id: implement
          type: ai
          agent: claude
          model: sonnet
          prompt: prompts/implement-ticket.j2
          allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
          writes_files: true
          writes: []

        - id: verify
          type: script
          command: |
            set +e
            output=$(eval "$1" 2>&1)
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              msg="Verify gate failed (exit ${exit_code}):"$'\n'"${output}"
              jq -n --argjson c "$exit_code" --arg o "$output" --arg m "$msg" \
                '{"verify_exit_code":$c,"verify_output":$o,"issues":[$m]}'
            else
              jq -n --argjson c "$exit_code" --arg o "$output" \
                '{"verify_exit_code":$c,"verify_output":$o,"issues":[]}'
            fi
          args: ["$inputs.verify_command"]
          contract:
            verify_exit_code: integer
            verify_output: string
            issues:
              type: list
              of: string
          writes: [verify_exit_code, verify_output, issues]

        - id: gate-verify
          type: check
          expr: 'state.verify_exit_code == 0'
          on_fail: "retry_loop:fix-loop"

        - id: capture-diff
          type: script
          command: |
            diff_text=$(git diff "$1...HEAD" 2>/dev/null || true) && jq -n --arg d "$diff_text" '{diff: $d}'
          args: ["$inputs.base_branch"]
          contract:
            diff: string
          writes: [diff]

        - id: review
          type: ai
          agent: codex
          prompt: prompts/review-ticket.j2
          allowed_tools: [Read, Grep, Glob]
          contract:
            verdict:
              type: string
              enum: [PASS, FAIL, DEFER]
            issues:
              type: list
              of: string
            commit_message: string
            deferred_brief: string
          writes:
            - verdict
            - {field: issues, merge: replace}
            - commit_message
            - deferred_brief

        - id: gate-retry
          type: check
          expr: 'state.verdict != "FAIL"'
          on_fail: "retry_loop:fix-loop"

  - id: notify-exhausted
    type: script
    cwd: "."
    command: |
      VERDICT="$1"
      LINEAR_ID="$2"
      BRANCH="$3"
      ISSUES="$4"
      if [ "$VERDICT" != "PASS" ] && [ "$VERDICT" != "DEFER" ]; then
        TODO_STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"query{issue(id:\\\"${LINEAR_ID}\\\"){team{states{nodes{id type}}}}}\"}" \
          | jq -r '.data.issue.team.states.nodes[] | select(.type=="unstarted") | .id' \
          | head -1)
        COMMENT=$(printf 'Review loop exhausted after maximum iterations without passing. Work in progress on branch: %s.\n\nReviewer findings:\n%s\n\nPlease inspect and retry.' "${BRANCH}" "${ISSUES}")
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg issue_id "$LINEAR_ID" --arg body "$COMMENT" '{"query":"mutation{commentCreate(input:{issueId:\($issue_id),body:\($body)}){success}}"}')" \
          > /dev/null
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg id "$LINEAR_ID" --arg state_id "$TODO_STATE_ID" '{"query":"mutation{issueUpdate(id:\($id),input:{stateId:\($state_id)}){success}}"}')" \
          > /dev/null
      fi
      printf '{}'
    args: ["$state.verdict", "$inputs.linear_id", "$state.worktree_branch", "$state.issues"]
    writes: []

  - id: gate-exhausted
    type: check
    expr: 'state.verdict in ("PASS", "DEFER")'
    on_fail: cancel

  - id: handle-deferred
    type: script
    cwd: "."
    command: |
      VERDICT="$1"
      BRIEF="$2"
      LINEAR_ID="$3"
      if [ "$VERDICT" = "DEFER" ]; then
        TEAM_ID=$(curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"query{issue(id:\\\"${LINEAR_ID}\\\"){team{id}}}\"}" \
          | jq -r '.data.issue.team.id')
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg team_id "$TEAM_ID" --arg title "$BRIEF" --arg parent_id "$LINEAR_ID" '{"query":"mutation{issueCreate(input:{teamId:\($team_id),title:\($title),parentId:\($parent_id)}){success issue{identifier}}}"}')" \
          > /dev/null
      fi
      printf '{}'
    args: ["$state.verdict", "$state.deferred_brief", "$inputs.linear_id"]
    writes: []

  - id: set-in-review
    type: script
    command: |
      NODES=$(curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){team{states{nodes{id name type}}}}}\"}" \
        | jq -c '.data.issue.team.states.nodes')
      STATE_ID=$(printf '%s' "$NODES" \
        | jq -r 'map(select(.type=="started")) | (map(select((.name | ascii_downcase) == "in review")) | first) // first | .id // empty')
      if [ -n "$STATE_ID" ]; then
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          --data-raw "{\"query\":\"mutation{issueUpdate(id:\\\"$1\\\",input:{stateId:\\\"${STATE_ID}\\\"}){success}}\"}" \
          > /dev/null
      fi
      printf '{}'
    args: ["$inputs.linear_id"]
    writes: []

  - id: commit
    type: script
    command: |
      git add -A >&2
      git commit --amend -m "$2" >&2
      printf '{"commit_sha": "%s"}' "$(git rev-parse HEAD)"
    args: ["$state.worktree_branch", "$state.commit_message"]
    contract:
      commit_sha: string
    writes: [commit_sha]

  - id: attempt-merge
    type: script
    cwd: "."
    command: |
      git checkout "$1" >&2
      if git merge --no-ff "$2" >&2; then
        printf '{"merge_status": "clean", "conflict_files": ""}'
      else
        CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
        printf '{"merge_status": "conflict", "conflict_files": "%s"}' "$CONFLICTS"
      fi
    args: ["$inputs.base_branch", "$state.worktree_branch"]
    contract:
      merge_status:
        type: string
        enum: [clean, conflict]
      conflict_files: string
    writes: [merge_status, conflict_files]

  - id: conflict-loop
    type: loop
    loop:
      max_iterations: 2
      until: 'state.merge_status == "clean"'
      on_exhaust: continue
      steps:

        - id: gate-still-conflicted
          type: check
          expr: 'state.merge_status == "conflict"'
          on_fail: "retry_loop:conflict-loop"

        - id: resolve-conflicts
          type: ai
          agent: claude
          model: sonnet
          cwd: "."
          prompt: prompts/build/resolve-conflicts.j2
          allowed_tools: [Read, Write, Edit, Bash, Grep, Glob]
          writes_files: true
          contract:
            merge_status:
              type: string
              enum: [clean, conflict]
            merge_commit_message: string
          writes: [merge_status, merge_commit_message]

        - id: gate-conflict-resolved
          type: check
          expr: 'state.merge_status == "clean"'
          on_fail: "retry_loop:conflict-loop"

  - id: notify-merge-exhausted
    type: script
    cwd: "."
    command: |
      MERGE_STATUS="$1"
      LINEAR_ID="$2"
      BRANCH="$3"
      CONFLICTS="$4"
      if [ "$MERGE_STATUS" = "conflict" ]; then
        git push -u origin "$BRANCH" >&2
        # Linear comment and Todo reset are best-effort; a credential or API
        # failure leaves the ticket state unchanged but the rescue push above
        # ensures the work is not lost. Gate-merge-clean handles cancellation.
        TODO_STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"query\":\"query{issue(id:\\\"${LINEAR_ID}\\\"){team{states{nodes{id type}}}}}\"}" \
          | jq -r '.data.issue.team.states.nodes[] | select(.type=="unstarted") | .id' \
          | head -1)
        COMMENT=$(printf 'Merge conflict loop exhausted. Feature branch pushed for manual inspection: %s\n\nConflicting files: %s\n\nResolve manually and push.' "${BRANCH}" "${CONFLICTS}")
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg issue_id "$LINEAR_ID" --arg body "$COMMENT" \
            '{"query":"mutation{commentCreate(input:{issueId:\($issue_id),body:\($body)}){success}}"}')" \
          > /dev/null
        curl -s -X POST https://api.linear.app/graphql \
          -H "Authorization: $LINEAR_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg id "$LINEAR_ID" --arg state_id "$TODO_STATE_ID" \
            '{"query":"mutation{issueUpdate(id:\($id),input:{stateId:\($state_id)}){success}}"}')" \
          > /dev/null
      fi
      printf '{}'
    args: ["$state.merge_status", "$inputs.linear_id", "$state.worktree_branch", "$state.conflict_files"]
    writes: []

  - id: gate-merge-clean
    type: check
    expr: 'state.merge_status == "clean"'
    on_fail: cancel

  - id: push-base
    type: script
    cwd: "."
    command: |
      git push origin "$1" >&2
      printf '{}'
    args: ["$inputs.base_branch"]
    writes: []

  - id: teardown
    type: worktree
    action: cleanup
    policy: delete_unconditionally

  - id: close-task
    type: script
    cwd: "."
    command: |
      STATE_ID=$(curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        -d "{\"query\":\"query{issue(id:\\\"$1\\\"){team{states{nodes{id type}}}}}\"}" \
        | jq -r '.data.issue.team.states.nodes[] | select(.type=="completed") | .id' \
        | head -1)
      curl -s -X POST https://api.linear.app/graphql \
        -H "Authorization: $LINEAR_API_KEY" \
        -H "Content-Type: application/json" \
        --data-raw "{\"query\":\"mutation{issueUpdate(id:\\\"$1\\\",input:{stateId:\\\"${STATE_ID}\\\"}){success}}\"}" \
        > /dev/null
      printf '{}'
    args: ["$inputs.linear_id"]
    writes: []
