# Steward workflow — SPEC §14.
#
# The domain-steward review: read-only, no worktree, no code mutation.
# Smallest possible end-to-end exercise of the harness engine. Three
# nodes, pure YAML, inline contracts, derived state.
#
# Derived state (computed by harness.workflow.derive.derive_state_schema):
#   BaseState + summary, key_files, open_questions, findings,
#   systemic_insights, report_path.
#
# The author did NOT write:
#   - a StewardState Pydantic class — derived from the contracts
#   - standalone contract classes — declared inline
#   - custom Jinja templates — standard library is parameterised
#   - a state_schema: declaration — there is no such field
name: steward
version: 1
description: Domain steward review producing a structured report

inputs:
  domain:
    type: string
    enum: [architecture, harness, test, code, design]
    flag: --domain
    required: true

steps:
  - id: read-context
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/standard/analyze.j2
    template_vars:
      task: "Read the codebase and produce a structured summary of the $inputs.domain domain"
    allowed_tools: [Read, Grep, Glob, Bash]
    contract:
      summary: string
      key_files:
        type: list
        of: string
      open_questions:
        type: list
        of: string
    writes: [summary, key_files, open_questions]

  - id: assess
    type: ai
    agent: claude
    model: sonnet
    prompt: prompts/standard/review.j2
    template_vars:
      criteria: "$inputs.domain principles, recurring patterns, systemic issues"
    allowed_tools: [Read, Grep, Glob]
    contract:
      findings:
        type: list
        of:
          severity: string
          area: string
          description: string
      systemic_insights:
        type: list
        of: string
    writes: [findings, systemic_insights]

  - id: write-report
    type: script
    runtime: python
    script: scripts/write_steward_report.py
    args: ["--run-id", "$state.run_id", "--domain", "$inputs.domain"]
    contract:
      report_path: string
    writes: [report_path]
