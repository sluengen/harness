# =============================================================================
# Shared Agent Context — injected into every agent invocation
# =============================================================================
#
# This file provides project context that ALL agents need. Agent definitions
# reference it via: "Load shared context from `.claude/context.yaml`"
#
# This replaces the "read these 5 files before starting" pattern. Instead
# of hoping agents read the right files, the key facts are here.
#
# Update this file when tech stack, conventions, or key decisions change.
# =============================================================================
#
# PROJECT: Fill in all sections marked with <!-- PROJECT --> before use.
# Delete placeholder comments once populated.

project:
  name: <!-- PROJECT: Your project name -->
  repo: <!-- PROJECT: github.com/owner/repo -->
  mission: >
    <!-- PROJECT: One sentence describing what this project does and for whom. -->

# ---------------------------------------------------------------------------
# Tech stack
# ---------------------------------------------------------------------------
# PROJECT: Replace with your actual stack. Delete sections that don't apply.

backend:
  language: <!-- e.g. Python 3.11+ -->
  framework: <!-- e.g. FastAPI -->
  testing: <!-- e.g. pytest -->
  linting: <!-- e.g. ruff -->
  commands:
    lint: <!-- e.g. "ruff check ." -->
    test: <!-- e.g. "pytest tests/" -->
    both: <!-- e.g. "ruff check . && pytest tests/" -->

frontend:
  language: <!-- e.g. TypeScript -->
  framework: <!-- e.g. React 18 -->
  testing: <!-- e.g. Vitest + React Testing Library -->
  commands:
    test: <!-- e.g. "cd frontend && npm run test" -->
  conventions:
    - <!-- e.g. Functional components only -->
    - <!-- e.g. Named exports over default exports -->

# ---------------------------------------------------------------------------
# Key architecture decisions (read full ADRs only when designing)
# ---------------------------------------------------------------------------
# PROJECT: Summarize each ADR in one sentence. Keep this list current.

decisions:
  - id: ADR-009
    summary: Bash(*) allowed with deny list for destructive ops. Safety boundary is branch + worktree isolation.
  # - id: ADR-001
  #   summary: ...

# ---------------------------------------------------------------------------
# Pipeline (summary — full schema in specs/arch/pipeline-schema.yaml)
# ---------------------------------------------------------------------------

pipeline:
  schema: specs/arch/pipeline-schema.yaml
  model: artifact dependency graph (DAG)
  artifacts_location: "specs/changes/<task-id>/"
  feature_specs: "specs/features/"
  templates: "specs/templates/"
  manifest: manifest.yaml
  task_status: [todo, in_progress, done]  # coarse status only
  position_derived_from: artifact existence + waiver state in change folder
  requirement_levels:
    required: "Must exist. Only user (L2) can waive."
    recommended: "Proposer can skip with justification. Reviewer validates."
    optional: "Never blocks. Available when useful."

# ---------------------------------------------------------------------------
# Per-artifact rules — project-specific constraints
# ---------------------------------------------------------------------------
# PROJECT: Add project-specific guidance for each artifact type.

artifact_rules:
  proposal:
    - Check specs/features/ for existing behaviour before proposing changes
  delta:
    - Reference the canonical spec by path (specs/features/<name>.md)
  design:
    - Reference existing ADRs before making new architecture decisions
  tasks:
    - Include a "verify" task at the end to confirm tests pass and lint is clean
  code:
    - <!-- PROJECT: Add project-specific implementation constraints here -->
  review:
    - Validate waivers — if a recommended artifact was skipped, check the diff justifies it
    - Security — check for injection, data exposure, auth bypass

# ---------------------------------------------------------------------------
# Anti-patterns (key ones — full list in context/anti-patterns.md)
# ---------------------------------------------------------------------------

anti_patterns:
  - "Manifest updates committed separately from code changes"
  - "Lint before tests — lint failure is a blocker, don't waste time testing unlinted code"
  - "Don't assume stashes are stale — other sessions may be active"
  # PROJECT: Add project-specific anti-patterns here

# ---------------------------------------------------------------------------
# Security defaults
# ---------------------------------------------------------------------------
# PROJECT: Adjust to match your project's security model.

security:
  - Agents must not access, store, or transmit secrets
  - Input validation at every system boundary
  - No secrets in code — secrets are injected at deploy time
  # - All endpoints require auth by default
  # - Data is private by default (user can only access their own data)
